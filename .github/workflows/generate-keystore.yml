name: Générer la clé de signature (une seule fois)

on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: Écraser la clé existante (l'empreinte SHA changera)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  generate:
    name: Créer la clé et l'enregistrer dans les secrets
    runs-on: ubuntu-latest
    steps:
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Générer la clé et enregistrer les secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Ajoutez d'abord le secret GH_PAT (jeton GitHub avec la permission Secrets en lecture/écriture)."
            exit 1
          fi

          EXISTING="$(gh secret list --repo "$GITHUB_REPOSITORY" --json name --jq '.[].name')"
          if grep -qx "ANDROID_KEYSTORE_B64" <<< "$EXISTING" && [[ "$OVERWRITE" != "true" ]]; then
            echo "::error::La clé existe déjà. Relancez avec « Écraser » seulement si vous voulez la remplacer."
            exit 1
          fi

          PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$PASSWORD"

          keytool -genkeypair -noprompt \
            -keystore ongea-release.jks -storetype PKCS12 \
            -alias ongea -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname "CN=Ongea, OU=Ongea, O=Ongea, C=CD"

          base64 -w0 ongea-release.jks | gh secret set ANDROID_KEYSTORE_B64 --repo "$GITHUB_REPOSITORY"
          printf '%s' "$PASSWORD" | gh secret set ANDROID_KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY"
          echo "Secrets ANDROID_KEYSTORE_B64 et ANDROID_KEYSTORE_PASSWORD enregistrés."

          echo "=== Empreintes à ajouter dans Firebase ==="
          keytool -list -v -keystore ongea-release.jks -alias ongea -storepass "$PASSWORD" \
            | grep -E "SHA1:|SHA256:"
