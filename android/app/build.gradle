plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

// FlutterFire configure ajoute google-services.json. Le plugin est facultatif en mode dÃ©mo.
if (file("google-services.json").exists()) {
    apply plugin: 'com.google.gms.google-services'
}

// ClÃ© de signature fixe (facultative). Le workflow GitHub crÃ©e android/key.properties
// et android/app/ongea-release.jks Ã  partir des secrets. Sans eux, on retombe sur la
// clÃ© de dÃ©bogage (l'empreinte SHA change alors Ã  chaque build).
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace "com.ongea.app"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.ongea.app"
        minSdk 23
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            // Le plugin Flutter active shrinkResources par dÃ©faut en release ;
            // il exige minifyEnabled true. On dÃ©sactive les deux explicitement.
            minifyEnabled false
            shrinkResources false
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source "../.."
}
